[workspace]
members = [
    "cli",
    "src-tauri",
    "core/backend",
    "core/tauri",
    "modules/*/backend",
    "modules/*/core",
    "modules/*/host",
    "examples/module-fixture/backend",
    "examples/rapid-terminal-probe",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
