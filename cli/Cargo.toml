[package]
name = "shipctl-cli"
version = "0.0.0"
description = "Agent-facing command line interface for Shipctl"
edition = "2021"
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "shipctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
base64 = "0.22"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shipctl-core = { path = "../core/backend" }
shipctl-module-semantic-terminal-core = { path = "../modules/semantic-terminal/core" }
toon-format = { version = "=0.5.0", default-features = false }
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
