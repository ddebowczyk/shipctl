[package]
name = "shipctl-cli"
version = "0.0.0"
description = "Agent-facing command line interface for Shipctl"
edition = "2021"
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "shipctl"
path = "src/main.rs"

[dependencies]
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shipctl-core = { path = "../core/backend" }
toon-format = { version = "=0.5.0", default-features = false }
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
serde_json = "1.0"
