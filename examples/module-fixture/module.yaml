---
schema_version: 1
id: fixture
frontend:
  package: "@shipctl/module-fixture"
  path: examples/module-fixture/frontend
  composition_symbol: fixtureModule
backend:
  crate: tauri-plugin-shipctl-fixture
  path: examples/module-fixture/backend
  cargo_feature: fixture-module
  dependency_alias: shipctl-module-fixture
  plugin_init: "shipctl_module_fixture::init()"
  host_glue: []
tauri:
  capability_identifier: fixture
  permissions:
    - shipctl-fixture:allow-ping
messages:
  provides:
    - id: fixture.agent-wakeup
      version: 1
      schema: examples/module-fixture/messages/agent-wakeup.schema.json
      max_encoded_bytes: 128
      redacted_fields:
        - /apiToken
      compatible_versions:
        - 1
  handles:
    - id: fixture.agent-wakeup
      message:
        id: fixture.agent-wakeup
        version: 1
      capacity: 4
      required_grant: message.send.fixture.agent-wakeup
      scheduler_allowed: true
  publishes: []
  subscribes: []
  ports: []
profile: profiles/fixture/tauri.conf.json
tests:
  frontend: examples/module-fixture/tests
  backend: null
