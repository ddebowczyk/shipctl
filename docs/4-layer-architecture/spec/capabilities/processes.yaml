---
$schema: ../schema/capability.v1.schema.yaml
schema_version: capability/v1
id: processes
version: 1.0.0
title: Scoped process inspection and control
status: implementing
layer: native-kernel
consumers: [ports, assistants]
current_implementations:
  - module-api/frontend/src/protocol/processes.ts
  - core/frontend/platform/processes.ts
  - core/backend/src/processes
  - core/tauri/src/processes.rs
  - modules/ports/frontend
  - modules/assistants/backend
target_owners:
  provider: core/backend/src/processes
  tauri_adapter: core/tauri/src/processes.rs
  typescript_client: core/frontend/platform/processes
operations:
  - id: inspectListeningPorts
    kind: request
    contract: >-
      Return scoped listeners with an identity that detects PID reuse.
  - id: terminateInspectedProcess
    kind: request
    contract: >-
      Terminate only the process proven by a current authorized inspection.
  - id: inspectCommand
    kind: request
    contract: Report command availability without running the command.
required_grants:
  - process.inspect
  - process.terminate
ownership:
  authority: The native kernel owns OS process access and scope enforcement.
  resources: >-
    An inspection identity binds an opaque ID to PID and process start time and
    expires on rescan, termination, or activation disposal.
  activation_scope: >-
    Every request carries activation identity; operation grants admit native
    work, and an activation-owned inspection lease scopes termination.
depends_on: []
property_ids:
  - PROP-B-ADAPTER-001
  - PROP-B-REQUEST-001
  - PROP-D-PARITY-001
  - PROP-D-AUTHORITY-001
  - PROP-D-OWNERSHIP-001
  - PROP-D-CLOSURE-001
open_questions:
  - >-
    Phase E admission must replace the bootstrap static module grant table and
    bind project scope from the admitted activation identity. Phase D closes
    PID reuse with the observed process start time, with only the unavoidable
    operating-system interval between the final identity check and the signal.
