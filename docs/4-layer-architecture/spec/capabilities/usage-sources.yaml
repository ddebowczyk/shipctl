---
$schema: ../schema/capability.v1.schema.yaml
schema_version: capability/v1
id: usage-sources
version: 1.0.0
title: Approved usage source access
status: implementing
layer: native-kernel
consumers: [usage]
current_implementations:
  - module-api/frontend/src/protocol/usageSources.ts
  - module-api/frontend/src/testing/usageSources.ts
  - core/frontend/platform/usageSources.ts
  - modules/usage/frontend/src/usageSourcesClient.ts
  - modules/usage/backend
target_owners:
  provider: core/backend/src/usage_sources
  tauri_adapter: core/tauri/src/usage_sources.rs
  typescript_client: core/frontend/platform/usageSources
operations:
  - id: inspectSource
    kind: request
    contract: >-
      Read approved provider source records without exposing native source or
      credential authority. The legacy overview projection is temporary until
      Phase D moves aggregation policy to TypeScript.
  - id: refreshSources
    kind: request
    contract: Request refresh of an explicit set of approved provider sources.
  - id: observeSource
    kind: event
    contract: Observe approved source changes through an activation lease.
required_grants:
  - usage-source.read
  - usage-source.refresh
  - usage-source.observe
ownership:
  authority: The native kernel owns source path and credential boundaries.
  resources: Source files are external; observation leases are activation-owned.
  activation_scope: Provider and source identities are explicit and reviewed.
depends_on: [credential-store]
property_ids:
  - PROP-B-ADAPTER-001
  - PROP-B-REQUEST-001
  - PROP-B-ACTIVATION-001
  - PROP-B-EVENT-001
  - PROP-B-FAKE-001
  - PROP-D-PARITY-001
  - PROP-D-AUTHORITY-001
