---
$schema: ../schema/capability.v1.schema.yaml
schema_version: capability/v1
id: credential-store
version: 1.0.0
title: Namespaced credential storage
status: implementing
layer: native-kernel
consumers: [assistants, usage]
current_implementations:
  - module-api/frontend/src/protocol/credentials.ts
  - module-api/frontend/src/testing/credentials.ts
  - core/frontend/platform/credentials.ts
  - modules/assistants/frontend/src/credentialStoreClient.ts
  - core/backend/src/credentials
  - core/tauri/src/credentials.rs
  - core/backend/src/usage_sources/providers.rs
target_owners:
  provider: core/backend/src/credentials
  tauri_adapter: core/tauri/src/credentials.rs
  typescript_client: core/frontend/platform/credentials
operations:
  - id: hasCredential
    kind: request
    contract: Report availability without exposing credential bytes.
  - id: saveCredential
    kind: request
    contract: Save one value in an activation-authorized namespace.
  - id: deleteCredential
    kind: request
    contract: Delete one authorized value without disclosing it.
required_grants:
  - credential.inspect
  - credential.write
ownership:
  authority: The native kernel owns secret storage and non-disclosure.
  resources: Credentials survive plugin replacement and are never snapshots.
  activation_scope: Plugin and provider namespaces are mandatory.
depends_on: []
property_ids:
  - PROP-B-ADAPTER-001
  - PROP-B-REQUEST-001
  - PROP-B-ACTIVATION-001
  - PROP-B-FAKE-001
  - PROP-D-AUTHORITY-001
  - PROP-D-OWNERSHIP-001
