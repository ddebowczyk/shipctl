---
$schema: ../schema/capability.v1.schema.yaml
schema_version: capability/v1
id: skill-installation
version: 2.0.0
title: Reviewed skill installation operations
status: implemented
layer: native-kernel
consumers: [skills]
current_implementations:
  - module-api/frontend/src/protocol/skillInstallation.ts
  - module-api/frontend/src/testing/skillInstallation.ts
  - core/frontend/platform/skillInstallation.ts
  - core/backend/src/skill_installation
  - core/tauri/src/skill_installation.rs
  - modules/skills/frontend/src/catalog.ts
  - modules/skills/frontend/src/skillInstallationClient.ts
target_owners:
  provider: core/backend/src/skill_installation
  tauri_adapter: core/tauri/src/skill_installation.rs
  typescript_client: core/frontend/platform/skillInstallation
operations:
  - id: inspectSkills
    kind: request
    contract: >-
      Inspect installation state for caller-supplied stable skill identities
      inside one approved project without native catalog policy.
  - id: installSkill
    kind: request
    contract: >-
      Validate and install one caller-supplied Markdown source into one
      approved project with atomic rollback.
  - id: removeSkill
    kind: request
    contract: Remove one authorized installed skill by stable identity.
required_grants:
  - skill.inspect
  - skill.install
  - skill.remove
ownership:
  authority: >-
    The native kernel owns path scope and atomic installation mechanics.
  resources: >-
    Installed files are project-owned durable resources and survive plugin
    replacement or activation disposal.
  activation_scope: >-
    Grants identify the caller, approved project root, and operation. They do
    not grant arbitrary filesystem access.
depends_on: []
property_ids:
  - PROP-B-ADAPTER-001
  - PROP-B-REQUEST-001
  - PROP-B-ACTIVATION-001
  - PROP-B-FAKE-001
  - PROP-D-PARITY-001
  - PROP-D-AUTHORITY-001
  - PROP-D-OWNERSHIP-001
  - PROP-D-CLOSURE-001
