---
$schema: ../schema/module-disposition.v1.schema.yaml
schema_version: module-disposition/v1
id: todos
status: migrating
source_manifest: modules/todos/module.yaml
current:
  frontend: modules/todos/frontend
  backend_crates: []
  host_crates: []
  direct_tauri: false
  static_activation: false
target:
  roles: [compound]
  responsibilities:
    - Implement todo document policy and workflow in TypeScript.
    - Publish todo views and commands through typed contributions.
  capabilities:
    - project-documents
    - workspace
phases: [phase-b, phase-c, phase-d, phase-e, phase-f, phase-g]
prerequisites:
  - Characterize todo parsing, ordering, mutation, and conflict behavior.
compatibility_paths:
  - >-
    Phase D native extraction is complete: Todos is frontend-only and uses the
    public project documents capability client.
  - >-
    Phase E packages Todos as an immutable built-in artifact. The host admits
    and activates it through the same runtime path as user-installed plugins.
deletion_gates:
  - id: DELETE-D-NATIVE-MODULE
    proof_ids: [PROP-D-PARITY-001, PROP-D-CLOSURE-001]
    targets:
      - modules/todos/backend
      - modules/todos/host
  - id: DELETE-E-STATIC-IMPORT
    proof_ids: [PROP-E-TODOS-PARITY-001, PROP-E-HEADLESS-001]
    targets:
      - core/frontend/host/enabledModules.ts
      - package.json
