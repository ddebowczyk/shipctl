---
$schema: ../schema/module-disposition.v1.schema.yaml
schema_version: module-disposition/v1
id: usage
status: migrating
source_manifest: modules/usage/module.yaml
current:
  frontend: modules/usage/frontend
  backend_crates: []
  host_crates: []
  direct_tauri: false
  static_activation: false
target:
  roles: [compound]
  responsibilities:
    - Implement usage ingestion and presentation policy in TypeScript.
    - Publish usage views, schedules, commands, and message handlers.
  capabilities:
    - usage-sources
    - credential-store
    - plugin-data
    - scheduler
    - messages
    - workspace
phases: [phase-b, phase-c, phase-d, phase-e, phase-f, phase-g]
prerequisites:
  - Characterize ingestion, alias review, refresh, and message behavior.
  - Separate usage source access from aggregation and presentation policy.
compatibility_paths:
  - >-
    Preserve usage.ingest-completed while source-change observation moves to
    the semantic Usage Sources event.
  - Route persistence and secrets through typed capability clients.
  - >-
    Phase E packages Usage as an immutable compound artifact. It declares
    Usage Sources, Plugin Data, Messages, and Scheduler because those are the
    services used by current code. Credential Store remains behind the native
    Usage Sources provider. Workspace remains a target capability; neither is
    pre-granted to the plugin before direct consumption exists.
deletion_gates:
  - id: DELETE-D-NATIVE-MODULE
    proof_ids:
      - PROP-D-PARITY-001
      - PROP-D-AUTHORITY-001
      - PROP-D-OWNERSHIP-001
      - PROP-D-CLOSURE-001
    targets:
      - modules/usage/backend
      - modules/usage/host
  - id: DELETE-E-STATIC-IMPORT
    proof_ids: [PROP-E-ARTIFACT-001, PROP-E-USAGE-PARITY-001]
    targets:
      - core/frontend/host/enabledModules.ts
      - package.json
  - id: DELETE-F-RESTART-LIFECYCLE
    proof_ids: [PROP-F-SERVICE-001, PROP-F-RESTART-001]
    targets:
      - modules/usage/frontend/src/activation.ts
