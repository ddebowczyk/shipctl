---
$schema: ../schema/module-disposition.v1.schema.yaml
schema_version: module-disposition/v1
id: semantic-terminal
status: migrating
source_manifest: modules/semantic-terminal/module.yaml
current:
  frontend: modules/semantic-terminal/frontend
  backend_crates: []
  host_crates: []
  direct_tauri: false
  static_activation: false
target:
  roles: [presentation]
  responsibilities:
    - Implement semantic terminal interaction policy in TypeScript.
    - Publish terminal views and actions through typed contributions.
  capabilities:
    - terminal-sessions
    - semantic-terminals
    - workspace
phases: [phase-b, phase-c, phase-d, phase-e, phase-f, phase-g]
prerequisites:
  - Characterize attach, flow control, history, selection, and paste behavior.
  - Separate terminal mechanics from semantic interaction policy.
compatibility_paths:
  - Keep terminal sessions alive while presentation activations are replaced.
  - >-
    Phase D native extraction is complete: Semantic Terminal is frontend-only
    and uses the public semantic-terminal capability client.
  - >-
    Parser state and activation-scoped native authority are permanent,
    Tauri-free core capabilities; presentation policy remains in TypeScript.
  - >-
    Phase E packages Semantic Terminal as an immutable presentation artifact.
    It declares Terminal Sessions and Semantic Terminals directly. Workspace
    remains a Phase G target capability; the current host presentation contract
    supplies terminal identity and visibility.
deletion_gates:
  - id: DELETE-D-NATIVE-MODULE
    proof_ids:
      - PROP-D-PARITY-001
      - PROP-D-AUTHORITY-001
      - PROP-D-OWNERSHIP-001
      - PROP-D-CLOSURE-001
    targets:
      - modules/semantic-terminal/backend
      - modules/semantic-terminal/core
      - modules/semantic-terminal/host
  - id: DELETE-E-STATIC-IMPORT
    proof_ids: [PROP-E-ARTIFACT-001, PROP-E-SEMANTIC-TERMINAL-PARITY-001]
    targets:
      - core/frontend/host/enabledModules.ts
      - package.json
  - id: DELETE-F-RESTART-LIFECYCLE
    proof_ids: [PROP-F-CONTINUITY-001, PROP-F-RESTART-001]
    targets:
      - modules/semantic-terminal/frontend/src/activation.ts
