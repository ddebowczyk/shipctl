---
$schema: ../schema/module-disposition.v1.schema.yaml
schema_version: module-disposition/v1
id: assistants
status: complete
source_manifest: modules/assistants/module.yaml
current:
  frontend: modules/assistants/frontend
  backend_crates: []
  host_crates: []
  direct_tauri: false
  static_activation: false
target:
  roles: [compound]
  responsibilities:
    - >-
      Provide assistant launch, transcript capture, model discovery, and
      settings policy as plugin application logic.
    - Publish assistant session views and commands through typed contributions.
  capabilities:
    - processes
    - terminal-sessions
    - assistant-launch
    - credential-store
    - plugin-data
    - workspace
phases: [phase-b, phase-c, phase-d, phase-e, phase-f, phase-g]
prerequisites:
  - Characterize launch, capture, resume, placement, and shutdown behavior.
  - >-
    Define generic process launch and recovery records with policy-owned
    provider data.
compatibility_paths:
  - Keep the built-in module active through the same Cordis activation path.
  - Keep native commands behind typed capability clients during migration.
  - >-
    Phase E packages Assistants as an immutable compound artifact. It declares
    Assistant Launch (including explicit bounded resource grants), Credential
    Store, Processes, Terminal Sessions, and Projects because those are the
    services used by current code. Its
    activation-owned runtime effect observes the project catalog without a
    workspace grant. Plugin Data and Workspace remain target capabilities; they
    are not pre-granted before the module consumes them.
deletion_gates:
  - id: DELETE-D-NATIVE-MODULE
    proof_ids:
      - PROP-D-PARITY-001
      - PROP-D-AUTHORITY-001
      - PROP-D-OWNERSHIP-001
      - PROP-D-CLOSURE-001
    targets:
      - modules/assistants/backend
      - modules/assistants/host
  - id: DELETE-E-STATIC-IMPORT
    proof_ids: [PROP-E-ARTIFACT-001, PROP-E-ASSISTANTS-PARITY-001]
    targets:
      - core/frontend/host/enabledModules.ts
      - package.json
  - id: DELETE-F-RESTART-LIFECYCLE
    proof_ids: [PROP-F-CONTINUITY-001, PROP-F-RESTART-001]
    targets:
      - modules/assistants/frontend/src/activation.ts
