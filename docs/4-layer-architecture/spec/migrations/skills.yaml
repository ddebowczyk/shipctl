---
$schema: ../schema/module-disposition.v1.schema.yaml
schema_version: module-disposition/v1
id: skills
status: complete
source_manifest: modules/skills/module.yaml
current:
  frontend: modules/skills/frontend
  backend_crates: []
  host_crates: []
  direct_tauri: false
  static_activation: false
target:
  roles: [compound]
  responsibilities:
    - Implement skill discovery and installation workflow policy in TypeScript.
    - Publish skill management views and commands as typed contributions.
    - Own project-catalog cache lifecycle through the generic Projects service.
  capabilities:
    - skill-installation
    - projects
    - workspace
phases: [phase-b, phase-c, phase-d, phase-e, phase-f, phase-g]
prerequisites:
  - Characterize skill discovery, installation, removal, and error behavior.
compatibility_paths:
  - >-
    Phase D native extraction is complete: Skills is frontend-only and uses
    the public Skill Installation capability client.
  - >-
    The TypeScript plugin owns built-in identities, catalog metadata, source
    selection, and Markdown; the native provider remains catalog-agnostic.
  - >-
    Phase E packages Skills as an immutable built-in artifact. The host admits
    and activates it through the same runtime path as user-installed plugins.
    It directly declares Skill Installation and Projects services, registers its
    provider and project-action contributions, and owns the catalog lease.
  - >-
    Skills has no durable plugin-owned record. Its per-project Zustand state is
    a render cache of the filesystem-backed Skill Installation capability, so
    the artifact does not declare an unused Plugin Data dependency.
deletion_gates:
  - id: DELETE-D-NATIVE-MODULE
    proof_ids:
      - PROP-D-PARITY-001
      - PROP-D-AUTHORITY-001
      - PROP-D-OWNERSHIP-001
      - PROP-D-CLOSURE-001
    targets:
      - modules/skills/backend
      - modules/skills/host
  - id: DELETE-E-STATIC-IMPORT
    proof_ids: [PROP-E-SKILLS-PARITY-001, PROP-E-HEADLESS-001]
    targets:
      - core/frontend/host/enabledModules.ts
      - package.json
