---
$schema: ../schema/phase.v1.schema.yaml
schema_version: phase/v1
id: phase-e
title: Immutable TypeScript application artifacts
status: complete
source: docs/4-layer-architecture/10-phase-e-immutable-plugin-artifacts.md
depends_on: [phase-a, phase-b, phase-c]
semantics:
  - id: SEM-E-001
    kind: MUST
    rule: >-
      Runtime installation consumes compiled immutable artifacts and never runs
      TypeScript compilation or package-manager scripts.
  - id: SEM-E-002
    kind: MUST
    rule: >-
      Artifact identity includes a content digest and every import URL is
      qualified by that digest.
  - id: SEM-E-003
    kind: MUST
    rule: >-
      Admitted declarations equal runtime registrations for services, grants,
      messages, effects, and optional contributions.
  - id: SEM-E-004
    kind: MUST-NOT
    rule: >-
      React, React DOM, Cordis, and the plugin API must not be bundled in an
      artifact; the host supplies their singleton identities.
  - id: SEM-E-005
    kind: MUST
    rule: >-
      Artifact import is passive and activation requires an explicit supervisor
      action.
  - id: SEM-E-006
    kind: MUST-NOT
    rule: >-
      Invalid, incompatible, or tampered artifacts must not affect active state.
  - id: SEM-E-007
    kind: MUST
    rule: >-
      Built-in and installed artifacts use the same loader and runtime contract.
  - id: SEM-E-008
    kind: MUST
    rule: >-
      Admission fails closed on incompatible plugin API, manifest, service, or
      contribution schema versions.
  - id: SEM-E-009
    kind: MUST
    rule: >-
      The application entrypoint is required, but React, CSS, assets, and all
      presentation contributions are optional.
properties:
  - id: PROP-E-ARTIFACT-001
    claim: >-
      Packing, admission, reading, and canonicalization preserve manifest
      meaning and every exact byte of a valid generated plugin tree.
    shapes: [roundtrip]
    evidence: [SEM-E-001, SEM-E-002]
    domain:
      generates: >-
        Normal paths, JavaScript, CSS, assets, schemas, Unicode metadata, empty
        optional directories, and file orders.
      excludes: [files outside authoritative artifact contract limits]
      strategy: Generate normalized path-byte tuples before manifest creation.
      classifications: [code-only, headless, compound, unicode, empty-optional]
    preconditions:
      - Generated manifests pass the versioned schema.
    oracle:
      primary:
        kind: roundtrip
        description: >-
          Compare retained path-byte tuples with admitted files and manifest.
        independence: Retained values exist before the packer runs.
      alternative:
        kind: reference
        description: >-
          An independent archive reader builds a path-to-digest map.
        independence: The reader and digest map do not use packer normalization.
    failure_value: >-
      Packaging changes asset bytes or loses a schema under a valid digest.
    runner:
      language: rust
      library: proptest
      test_id: architecture.artifact-roundtrip.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-TAMPER-001
    claim: >-
      Any covered byte, path, integrity, identity, or digest mutation fails
      before artifact activation.
    shapes: [safety]
    evidence: [SEM-E-002, SEM-E-006]
    domain:
      generates: >-
        Single and combined byte changes, traversal, symlinks, missing or extra
        files, digest mismatch, and manifest mismatch.
      excludes: [corruption after a separately successful native read]
      strategy: Start with a valid artifact and apply typed mutations.
      classifications: [byte, path, symlink, missing, extra, digest, manifest]
    preconditions:
      - Mutation starts from a valid generated artifact.
    oracle:
      primary:
        kind: invariant
        description: >-
          Compare retained bytes and independently recomputed SHA-256 values.
        independence: Digest computation is separate from admission code.
      alternative:
        kind: metamorphic
        description: >-
          Mutate every indexed field and require native preflight rejection.
        independence: >-
          Expected rejection follows mutation location, not parser output.
    failure_value: >-
      A changed dist/plugin.mjs runs under the admitted code digest.
    runner:
      language: rust
      library: proptest
      test_id: architecture.artifact-tamper.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-EXTERNALS-001
    claim: >-
      Every shared runtime import resolves to its host seed and no artifact
      contains a bundled second copy.
    shapes: [safety]
    evidence: [SEM-E-004]
    domain:
      generates: >-
        Plugin graphs importing React, React DOM, Cordis, plugin API, and
        allowed bundled dependencies.
      excludes: [minifier details that preserve module identity]
      strategy: Generate dependency graphs and externalization selections.
      classifications:
        - all-external
        - react-bundled
        - cordis-bundled
        - api-bundled
    preconditions:
      - The generated artifact build succeeds.
    oracle:
      primary:
        kind: invariant
        description: Inspect bundler metadata and runtime identity probes.
        independence: Probes ignore plugin source declarations.
      alternative:
        kind: reference
        description: >-
          Inspect every emitted chunk for forbidden imports and signatures.
        independence: >-
          Whole-output inspection does not trust the bundler metafile.
    failure_value: A second React copy breaks hooks at runtime.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.artifact-externals.property
      shrink: required
      replay: required
    tiers: [pr, release]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-MANIFEST-RUNTIME-001
    claim: >-
      A candidate activates only when its canonical runtime registration set
      equals its admitted manifest declarations.
    shapes: [differential]
    evidence: [SEM-E-003, SEM-E-006]
    domain:
      generates: >-
        Missing, extra, reordered, duplicate, or changed services, grants,
        messages, effects, and contributions.
      excludes: []
      strategy: Generate declarations and registrations independently.
      classifications: [equal, missing, extra, duplicate, changed]
    preconditions:
      - Artifact bytes and plugin API version are valid.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare independent native declaration and provisional runtime sets.
        independence: >-
          The collectors run on opposite sides of the loader boundary.
      alternative:
        kind: invariant
        description: >-
          Canary plugins attempt each declared and undeclared registration.
        independence: Canary intent is fixed before runtime collection.
    failure_value: >-
      A plugin registers an undeclared menu command after admission.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.manifest-runtime.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-BUILTIN-PARITY-001
    claim: >-
      Commands through built-in artifact and static reference paths produce
      equal public contributions, terminal launches, and notices.
    shapes: [differential]
    evidence: [SEM-E-007]
    domain:
      generates: >-
        Saved commands, project paths, launch results, and service failures.
      excludes: [pixel rendering]
      strategy: Run the same generated actions against two isolated fake hosts.
      classifications: [launch-success, launch-failure, notice, panel-action]
    preconditions:
      - Both paths receive equivalent in-memory services.
    oracle:
      primary:
        kind: reference
        description: Compare normalized catalogs and fake-host action logs.
        independence: The isolated hosts do not share plugin state.
      alternative:
        kind: reference
        description: >-
          Compare visible results and ordered semantic command traces.
        independence: The action trace is captured below contribution callbacks.
    failure_value: Artifact commands launch terminals with changed metadata.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.commands-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-PORTS-PARITY-001
    claim: >-
      Ports through built-in artifact and static reference paths produce equal
      navigation, scans, filtering, termination results, and service traces.
    shapes: [differential]
    evidence: [SEM-E-007]
    domain:
      generates: >-
        Listening processes, project paths, development and filtered process
        names, process commands, and inspection or termination denials.
      excludes: [pixel rendering, real process termination]
      strategy: Run each case against isolated fake process-service hosts.
      classifications:
        - scan-success
        - filtered-process
        - inspect-denied
        - terminate-denied
    preconditions:
      - Both paths receive equivalent in-memory process services.
    oracle:
      primary:
        kind: reference
        description: Compare normalized catalogs, results, and service traces.
        independence: The isolated hosts do not share plugin or service state.
      alternative:
        kind: invariant
        description: >-
          Assert admitted service and contribution declarations, passive load,
          and empty ledgers after repeated disposal.
        independence: The retained manifest exists before artifact loading.
    failure_value: >-
      The artifact filters a listener or terminates an inspection differently
      from the source module.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.ports-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-TODOS-PARITY-001
    claim: >-
      Todos through its direct source definition and built-in artifact produce
      equal contributions, project lifecycle requests, service traces, and
      disposal.
    shapes: [differential]
    evidence: [SEM-E-007]
    domain:
      generates: >-
        Persisted preferences, project catalogs and lifecycle changes,
        discovered TODO documents, and permitted or denied document discovery.
      excludes: [pixel rendering, native filesystem access]
      strategy: >-
        Run each case against isolated fake project-document, project-catalog,
        and plugin-data hosts.
      classifications:
        - enabled
        - disabled
        - discovery-success
        - discovery-denied
    preconditions:
      - >-
        Both paths receive equivalent in-memory project-document,
        project-catalog, and plugin-data services.
    oracle:
      primary:
        kind: reference
        description: Compare normalized catalogs and attributed request traces.
        independence: The isolated hosts do not share plugin or document state.
      alternative:
        kind: invariant
        description: >-
          Assert admitted service and contribution declarations, passive
          style loading, a single executable, and empty ledgers after repeated
          disposal.
        independence: The retained manifest exists before artifact loading.
    failure_value: >-
      The artifact discovers TODO documents or publishes contributions
      differently from the source module.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.todos-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-GIT-PARITY-001
    claim: >-
      Git through built-in artifact and direct source-definition paths produces
      equal contributions, refresh requests, facts, worktree expansion, and
      disposal.
    shapes: [differential]
    evidence: [SEM-E-007]
    domain:
      generates: >-
        Repository identities, branches, clean and dirty status, stored worktree
        preferences, expansion requests, and permitted or denied status reads.
      excludes: [pixel rendering, native Git execution]
      strategy: Run each case against isolated fake Git service hosts.
      classifications:
        - clean
        - dirty
        - refresh-success
        - refresh-denied
        - related-worktree
        - catalog-lifecycle
        - repository-change
        - stored-preference
    preconditions:
      - >-
        Both paths receive equivalent in-memory Git, project-catalog, and
        plugin-data services.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized catalogs, project facts, related paths, and
          attributed request traces.
        independence: >-
          The isolated hosts do not share plugin or repository state.
      alternative:
        kind: invariant
        description: >-
          Assert admitted service and contribution declarations, passive
          style loading, a single executable, and empty ledgers after repeated
          disposal.
        independence: The retained manifest exists before artifact loading.
    failure_value: >-
      The artifact refreshes repository state or expands related worktrees
      differently from the direct source definition.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.git-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-SKILLS-PARITY-001
    claim: >-
      Skills through its direct source definition and built-in artifact produce
      equal contributions, project lifecycle requests, catalog projections,
      install and remove behavior, notices, service traces, and disposal.
    shapes: [differential]
    evidence: [SEM-E-007, SEM-E-009]
    domain:
      generates: >-
        Project identities, installed states, refreshes, provider and action
        calls, and permitted or denied inspection, installation, and removal.
      excludes: [native filesystem access]
      strategy: >-
        Run each case against isolated fake Skill Installation and
        project-catalog hosts.
      classifications:
        - inspect
        - install
        - remove
        - denied
        - notice
        - catalog-lifecycle
    preconditions:
      - >-
        Both paths receive equivalent in-memory Skill Installation and
        project-catalog services.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized catalogs, snapshots, actions, notices, and
          attributed service traces.
        independence: The isolated hosts do not share plugin or provider state.
      alternative:
        kind: invariant
        description: >-
          Assert the exact service and contribution declarations, no React or
          presentation files, a single executable, and empty ledgers after
          repeated disposal.
        independence: The retained manifest exists before artifact loading.
    failure_value: >-
      The artifact installs a different skill source or retains project state
      after disposal.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.skills-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-THIN-TERMINAL-PARITY-001
    claim: >-
      Thin Terminal through built-in and source direct artifact definitions
      produces equal presentation identity, required grants, service binding,
      React wrapper props, focus helpers, raw-byte helpers, and disposal.
    shapes: [differential]
    evidence: [SEM-E-007, SEM-E-009]
    domain:
      generates: >-
        Terminal identities, visible and hidden states, activation identities,
        key and paste bytes, resize dimensions, output occurrences, and exits.
      excludes: [pixel rendering, native PTY execution]
      strategy: >-
        Compare source and admitted artifact declarations and wrapper output;
        compose both with the deterministic Terminal Sessions fake and the
        existing focus, byte, input, resize, exit, and teardown properties.
      classifications: [focus, key-input, paste, resize, exit, teardown]
    preconditions:
      - Both paths receive the same host React and Terminal Sessions service.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized terminal presentation catalogs, React wrapper
          props, required grants, and activation-owned stylesheet lifecycle.
        independence: >-
          The retained manifest and source module are loaded by separate paths.
      alternative:
        kind: invariant
        description: >-
          Assert one executable, one admitted stylesheet, passive import, exact
          service and grant declarations, and empty ledgers after disposal.
        independence: >-
          Native admission and the Cordis runtime enforce separate boundaries.
    failure_value: >-
      The artifact loses the thin-terminal presentation, changes its authority,
      or retains its xterm stylesheet after disposal.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.thin-terminal-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-SEMANTIC-TERMINAL-PARITY-001
    claim: >-
      Semantic Terminal through source direct artifact and admitted built paths
      produces equal presentation identity, required grants, service binding,
      React wrapper props, attachment behavior, and disposal.
    shapes: [differential]
    evidence: [SEM-E-007, SEM-E-009]
    domain:
      generates: >-
        Terminal identities, visible and hidden states, activation identities,
        input text, resize dimensions, screen revisions, history, anchors,
        selections, paste decisions, and attachment teardown.
      excludes: [pixel rendering, native PTY execution]
      strategy: >-
        Compare source and admitted artifact declarations and wrapper output;
        compose both with the deterministic Terminal Sessions and Semantic
        Terminals fakes and the existing interaction properties.
      classifications:
        - attach
        - flow-control
        - history
        - selection
        - paste
        - teardown
    preconditions:
      - >-
        Both paths receive the same host React, Terminal Sessions, and Semantic
        Terminals services.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized terminal presentation catalogs, React wrapper
          props, required grants, and activation-owned stylesheet lifecycle.
        independence: >-
          The retained manifest and source module are loaded by separate paths.
      alternative:
        kind: invariant
        description: >-
          Assert one executable, one admitted stylesheet, passive import, exact
          service and grant declarations, and empty ledgers after disposal.
        independence: >-
          Native admission and the Cordis runtime enforce separate boundaries.
    failure_value: >-
      The artifact loses semantic attachment authority, changes the presentation
      contract, or retains its stylesheet after disposal.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.semantic-terminal-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-ASSISTANTS-PARITY-001
    claim: >-
      Assistants through built-in artifact and source direct-definition paths
      produce equal panel identity, grants, semantic service access, restore and
      shutdown behavior, activation subscriptions, and disposal.
    shapes: [differential]
    evidence: [SEM-E-007, SEM-E-009]
    domain:
      generates: >-
        Provider identities, command availability, model catalogs, credential
        status, and activation identities.
      excludes:
        - pixel rendering
        - native process launch
        - native credential access
      strategy: >-
        Compare source and admitted artifact declarations; compose both with
        deterministic Assistant Launch, Credential Store, Processes, Terminal
        Sessions, and Projects fakes; exercise restore, shutdown, service use,
        panel loading, activation subscription, and repeated disposal.
      classifications:
        - command-inspection
        - model-catalog
        - credential-status
        - session-inspection
        - restore
        - shutdown
        - teardown
    preconditions:
      - >-
        Both paths receive equivalent isolated semantic services and host
        terminal lifecycle ports.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized module catalogs, service results and traces,
          restore notices, panel exports, runtime ledgers, and host lifecycle
          traces.
        independence: >-
          The retained source module and admitted artifact are loaded by
          separate Vite and native artifact paths.
      alternative:
        kind: invariant
        description: >-
          Assert one executable, no styles or loose assets, exact service and
          grant declarations, passive import, and empty ledgers after repeated
          disposal.
        independence: >-
          Native admission and the Cordis runtime enforce separate boundaries.
    failure_value: >-
      The artifact changes assistant authority, loses the launcher panel,
      bypasses a semantic service, or retains a terminal subscription.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.assistants-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-USAGE-PARITY-001
    claim: >-
      Usage through its direct source definition and admitted built artifact
      produces equal settings access, source ingestion and observation,
      directed refresh, scheduled work, presentation catalogs, activation
      ledgers, and disposal.
    shapes: [differential]
    evidence: [SEM-E-007, SEM-E-009]
    domain:
      generates: >-
        Usage providers, visibility settings, budget modes, monthly budgets,
        preserved settings extensions, and activation identities.
      excludes:
        - pixel rendering
        - native provider subprocess execution
        - native credential access
      strategy: >-
        Compare source direct and admitted artifact declarations; compose both
        with deterministic Usage Sources, Plugin Data, Messages, and Scheduler
        fakes; exercise startup ingestion, the directed refresh channel,
        scheduled message delivery, source-change observation, denied observer
        access, presentation loading, and repeated disposal.
      classifications:
        - settings-load
        - source-ingestion
        - refresh-message
        - source-observation
        - schedule-registration
        - denied-observation
        - presentation-load
        - teardown
    preconditions:
      - >-
        Both paths receive equivalent isolated semantic services and the same
        admitted activation identity.
    oracle:
      primary:
        kind: reference
        description: >-
          Compare normalized module catalogs, semantic-service traces, message
          receipts, presentation exports, and active runtime ledgers.
        independence: >-
          The retained source module and admitted artifact are loaded by
          separate Vite and native artifact paths.
      alternative:
        kind: invariant
        description: >-
          Assert one executable, one stylesheet, no loose assets, exact service
          and grant declarations, characterized alias policy, and empty ledgers
          after repeated disposal.
        independence: >-
          Native admission, the Cordis runtime, and the existing Usage
          characterization suite enforce separate boundaries.
    failure_value: >-
      The artifact changes ingestion or refresh behavior, loses a Usage view,
      bypasses the semantic service wall, or retains an observer or schedule.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.usage-artifact-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-COMPATIBILITY-001
    claim: >-
      Admission accepts exactly the generic artifact protocol and host API
      version tuples allowed by an independent compatibility model.
    shapes: [differential]
    evidence: [SEM-E-006, SEM-E-008]
    domain:
      generates: >-
        API ranges, prereleases, artifact schema versions, absent host API
        requirements, and malformed ranges.
      excludes: []
      strategy: Generate each compatibility dimension independently.
      classifications:
        - compatible
        - api
        - artifact-protocol
        - malformed
    preconditions:
      - Version values are valid or explicit malformed generator cases.
    oracle:
      primary:
        kind: model
        description: >-
          A small table evaluates dimensions and combines required ones
          fail-closed.
        independence: It calls neither manifest parser nor range evaluator.
      alternative:
        kind: reference
        description: >-
          Compare with a separate standards library and reviewed boundary cases.
        independence: The reference library is not a runtime dependency.
    failure_value: >-
      An artifact with an unsupported protocol or newer API contract activates
      on an older unsafe host.
    runner:
      language: rust
      library: proptest
      test_id: architecture.artifact-compatibility.property
      shrink: required
      replay: required
    tiers: [pr, release]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
  - id: PROP-E-HEADLESS-001
    claim: >-
      A valid headless artifact completes pack, admission, activation, service
      use, inspection, and disposal without presentation declarations.
    shapes: [roundtrip, state-machine]
    evidence: [SEM-E-001, SEM-E-003, SEM-E-005, SEM-E-009]
    domain:
      generates: >-
        Providers, consumers, background effects, commands, configuration, and
        zero presentation files.
      excludes: [native process crash]
      strategy: Generate minimal and compound headless service graphs.
      classifications: [provider, consumer, background, command, no-assets]
    preconditions:
      - Service versions and native grants are compatible.
    oracle:
      primary:
        kind: roundtrip
        description: >-
          Compare manifest, admitted descriptor, inspection, and effect ledgers.
        independence: The retained manifest exists before artifact loading.
      alternative:
        kind: reference
        description: >-
          Exercise a no-React artifact through native preflight and packaged
          host.
        independence: The packaged boundary does not use the in-memory ledger.
    failure_value: >-
      Admission assumes every plugin has a React component or stylesheet.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.headless-artifact.property
      shrink: required
      replay: required
    tiers: [pr, release]
    status: passing
    deletion_gates: [DELETE-E-STATIC-IMPORT]
deliverables:
  - A closed manifest and digest-qualified immutable artifact format.
  - One no-React service artifact plus Commands and Ports built-in artifacts.
  - One loader and lifecycle contract for built-in and installed plugins.
deletion_gates:
  - id: DELETE-E-STATIC-IMPORT
    condition: >-
      Artifact integrity, parity, compatibility, and package proofs pass.
    removes:
      - Direct source import and root dependency of the migrated built-in.
      - The legacy contribution allowlist after candidate validation parity.
