---
$schema: ../schema/phase.v1.schema.yaml
schema_version: phase/v1
id: phase-g
title: Workspace contributions and wall closure
status: complete
source: >-
  docs/4-layer-architecture/12-phase-g-workspace-contributions-and-closure.md
depends_on: [phase-a, phase-b, phase-c, phase-e, phase-f]
semantics:
  - id: SEM-G-001
    kind: MUST
    rule: >-
      The workspace consumes only accepted catalog snapshots and never
      discovers, loads, authorizes, or activates plugins.
  - id: SEM-G-002
    kind: MUST-NOT
    rule: >-
      A semantic view contribution declares identity, metadata, scope,
      cardinality, placement, capabilities, and a lazy view, but no Layman node.
  - id: SEM-G-003
    kind: MUST
    rule: >-
      Removed definitions become recoverable missing records or are removed by
      stated policy without corrupting the workspace document.
  - id: SEM-G-004
    kind: MUST
    rule: >-
      Standard and Layman adapters project one semantic workspace and invoke the
      same workspace actions.
  - id: SEM-G-005
    kind: MUST
    rule: >-
      Layout mutations preserve document validity and reset to a deterministic
      default derived from the accepted catalog.
  - id: SEM-G-006
    kind: MUST
    rule: >-
      Every live contribution is activation-owned and leaves no stale component
      or stylesheet after removal. A recoverable missing workspace record may
      retain historical owner identity but cannot resolve a renderer, route, or
      service.
  - id: SEM-G-007
    kind: MUST
    rule: >-
      Built-in and installed plugins use one runtime path with no static module
      list or native feature plugin dependency.
  - id: SEM-G-008
    kind: MUST
    rule: >-
      The app boots and remains operable when any individual plugin is absent,
      disabled, incompatible, or broken.
properties:
  - id: PROP-G-WORKSPACE-001
    claim: >-
      Reconciliation always produces a valid document whose live instances
      reference accepted definitions or explicit recoverable-missing records.
    shapes: [state-machine]
    evidence: [SEM-G-001, SEM-G-003]
    domain:
      generates: >-
        View add, replace, disable, remove, re-enable, open, close, move, split,
        focus, and restore histories.
      excludes: [pixel geometry]
      strategy: >-
        Generate catalog revisions and valid workspace commands by state.
      classifications: [added, replaced, missing, restored, moved, focused]
    preconditions:
      - Input catalogs are accepted and revisioned.
    oracle:
      primary:
        kind: model
        description: >-
          A pure model tracks definition and instance IDs and missing-view
          policy.
        independence: The model imports no renderer or workspace implementation.
      alternative:
        kind: metamorphic
        description: >-
          Validate each state and apply inverse commands where they exist.
        independence: Schema and inverse checks do not use transition modeling.
    failure_value: >-
      Disabling usage corrupts layout and prevents terminal views from
      reopening.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.workspace-reconcile.property
      shrink: required
      replay: required
    tiers: [pr, nightly]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-RENDERER-001
    claim: >-
      Standard and Layman adapter projections expose equal semantic view IDs,
      active view, tab order, and actions for every shared-subset document.
    shapes: [differential]
    evidence: [SEM-G-004]
    domain:
      generates: >-
        One-root-stack shared documents, select and permitted-close actions,
        and missing placeholders.
      excludes: [splits, floating stacks, maximized stacks, pixel output]
      strategy: >-
        Project one schema-valid shared-stack document through both adapters
        and dispatch the real Layman user command gate.
      classifications: [single-stack, tabs, select, close, select-noop, missing]
    preconditions:
      - The source workspace document passes schema validation.
    oracle:
      primary:
        kind: reference
        description: Compare normalized projections and semantic action logs.
        independence: >-
          Adapter harnesses are independent and share only input data.
      alternative:
        kind: reference
        description: >-
          Drive independent user harnesses and compare stable IDs and commands.
        independence: DOM events do not use projection normalization.
    failure_value: >-
      Selecting thin terminal in Layman focuses a semantic terminal.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.canvas-adapter-parity.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-LAYMAN-MOVE-001
    claim: >-
      A tiled Layman centre-drop emits the exact semantic append move and
      preserves the independently modeled source and target tab membership.
    shapes: [differential]
    evidence: [SEM-G-005]
    domain:
      generates: >-
        Two-tiled-stack workspace documents, selected source tabs, available
        and missing view placeholders, and populated target stacks.
      excludes: [edge drops, root drops, floating stacks, resize, pixels]
      strategy: >-
        Project one valid document through Layman, dispatch its real user
        centre-drop gate, and compare the action and tab membership with a
        pure source-removal and target-append model.
      classifications:
        - source-retained
        - source-collapsed
        - target-append
        - missing
    preconditions:
      - The source workspace document passes schema validation.
      - Both tiled Layman window IDs derive from semantic stack IDs.
    oracle:
      primary:
        kind: model
        description: >-
          Compare the emitted semantic move and Layman tab membership with a
          pure source-removal and target-append model.
        independence: >-
          The model imports neither Layman nor workspace implementation code.
      alternative:
        kind: reference
        description: >-
          Apply the emitted command through the semantic workspace authority
          and compare canonical stack membership after projection.
        independence: >-
          The authority is reached only through the public bridge command.
    failure_value: >-
      Dragging a terminal changes only renderer state or targets the wrong
      semantic stack.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.layman-semantic-move.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-LAYMAN-SPLIT-001
    claim: >-
      An eligible Layman edge drop emits the exact semantic split direction
      without carrying a renderer-local window identity into the workspace
      action or document.
    shapes: [differential, safety]
    evidence: [SEM-G-005]
    domain:
      generates: >-
        Two-tiled-stack workspace documents, selected source tabs, all four
        edge placements, and available and missing view placeholders.
      excludes:
        - root drops
        - floating stacks
        - floating movement
        - resize
        - maximize
        - pixels
      strategy: >-
        Project one valid document through Layman, dispatch its real user
        edge-drop gate, and compare the action with a pure edge-direction
        table while inspecting the temporary renderer window identity.
      classifications:
        - two-tiled-stacks
        - edge-split
        - horizontal
        - vertical
        - before
        - after
        - semantic-action
        - renderer-local-window
    preconditions:
      - The source workspace document passes schema validation.
      - The source view permits splitting.
      - Both tiled Layman window IDs derive from semantic stack IDs.
    oracle:
      primary:
        kind: model
        description: >-
          Compare the emitted split axis and position with a pure edge
          direction table, and reject a semantic-shaped temporary window ID.
        independence: >-
          The table imports neither Layman nor workspace implementation code.
      alternative:
        kind: reference
        description: >-
          Route an ID-free split through the public bridge, then validate the
          authority-produced document identities and topology.
        independence: >-
          The bridge only carries semantic action fields; generated authority
          histories validate document structure independently.
    failure_value: >-
      A renderer-created window identity becomes durable workspace state, or
      an edge split is created on the wrong side of its target stack.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.layman-semantic-split.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-LAYOUT-001
    claim: >-
      Persistence and restore preserve semantic identity, topology, focus, open
      views, and missing definitions after canonical normalization.
    shapes: [roundtrip]
    evidence: [SEM-G-005]
    domain:
      generates: >-
        Splits, tabs, optional floating windows, schema-valid sizes, open views,
        and missing definitions.
      excludes: [physical monitor coordinates normalized by migration policy]
      strategy: Construct valid workspace trees directly from schema rules.
      classifications: [tabs, splits, floating, open-views, missing]
    preconditions:
      - Source documents are valid for their schema version.
    oracle:
      primary:
        kind: roundtrip
        description: >-
          Compare retained semantic source with restored canonical state.
        independence: The retained source does not use Layman serialization.
      alternative:
        kind: reference
        description: >-
          Compare topology and identity using a schema-independent tree walk.
        independence: >-
          Tree walking is separate from the persistence canonicalizer.
    failure_value: >-
      Restart changes terminal identity because renderer state was persisted.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.workspace-roundtrip.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-WORKSPACE-OPERATIONS-001
    claim: >-
      The rendererless public workspace service validates and plans without
      writing, applies every retained semantic layout operation, and commits an
      ordered batch exactly once or leaves its document and revision unchanged.
    shapes: [safety, metamorphic]
    evidence: [SEM-G-005]
    domain:
      generates: >-
        Public validate, plan, apply, open, close, focus, select, move, split,
        rename, resize, float, dock, maximize, restore, reset, and
        stale-revision requests.
      excludes: [renderer interaction, view-local plugin data]
      strategy: >-
        Drive the public semantic service through a headless activation and
        compare plans, committed documents, revisions, and structured failures.
      classifications: [validate, plan, atomic-batch, one-revision, conflict]
    preconditions:
      - The bundled workspace plugin has an accepted catalog and plugin-data
        grants.
    oracle:
      primary:
        kind: invariant
        description: >-
          A rejected later batch step leaves the pre-batch document and revision
          intact; a successful complete batch advances exactly one revision.
        independence: >-
          Service responses and authority inspection are compared at distinct
          public boundaries.
      alternative:
        kind: metamorphic
        description: >-
          A validate or plan of a valid command produces the same next document
          that apply commits, while neither dry-run changes the current
          revision.
        independence: Planning does not call the persistence commit path.
    failure_value: >-
      An agent observes a planned layout that cannot be applied atomically, or a
      failed operation partially changes the saved workspace.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.workspace-public-operations.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-CONTRIBUTION-CLEANUP-001
    claim: >-
      After plugin removal, no live catalog, mounted view, stylesheet, route,
      menu, navigation, or component cache resolves the removed activation.
      A recoverable missing workspace record may retain historical owner
      identity only as inert metadata.
    shapes: [conservation]
    evidence: [SEM-G-006]
    domain:
      generates: >-
        Plugins contributing every UI family with open and closed views,
        replacement, failure, and removal.
      excludes: [unreachable browser engine module-cache bytes]
      strategy: >-
        Generate owner-tagged contribution families and lifecycle commands.
      classifications: [view, style, command, menu, navigation, cache]
    preconditions:
      - The removal transition settles before inspection.
    oracle:
      primary:
        kind: model
        description: Compare generated owner ledger with host inspection.
        independence: The ledger exists before registration and disposal.
      alternative:
        kind: invariant
        description: >-
          Catalog, DOM style, route, subscription, and resource canaries
          disappear.
        independence: Each canary is observed at its public boundary.
    failure_value: A stale menu invokes a new plugin that reused its ID.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.contribution-cleanup.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-ABSENCE-001
    claim: >-
      For every generated selected built-in subset, the host boots to an
      operable workspace with that subset, makes no import request for an
      excluded package, and retains the accepted workspace after a failed
      candidate.
    shapes: [safety]
    evidence: [SEM-G-007, SEM-G-008]
    domain:
      generates: >-
        Admitted built-in subsets plus one injected load or readiness failure.
      excludes: []
      strategy: >-
        Generate empty, singleton, and mixed template-derived selections and
        run the real live supervisor with catalog-constrained artifact URL and
        import adapters; do not import a plugin implementation package.
      classifications:
        - empty-optional
        - singleton
        - mixed
        - load-failure
        - not-ready
    preconditions:
      - Required platform services are available.
    oracle:
      primary:
        kind: model
        description: >-
          Compare accepted IDs, owners, and core operability with subset model.
        independence: The subset model does not import plugin implementations.
      alternative:
        kind: reference
        description: >-
          Exercise the live supervisor, message bridge, artifact loader,
          Cordis activation, and workspace authority with an import canary.
        independence: >-
          The host lifecycle is separate from the subset model; the canary
          admits only the current catalog identities and loads no module
          implementation package.
    failure_value: A missing built-in package prevents the host from starting.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.plugin-absence.property
      shrink: required
      replay: required
    tiers: [pr, release]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
  - id: PROP-G-CONTRIBUTION-SCHEMA-001
    claim: >-
      Contribution admission accepts renderer-neutral semantic views and
      rejects any declaration that embeds a Layman node or another renderer
      implementation detail.
    shapes: [safety]
    evidence: [SEM-G-002]
    domain:
      generates: >-
        Valid semantic view definitions plus one renderer-specific field or
        malformed lazy-view mutation.
      excludes: [renderer projection output]
      strategy: >-
        Generate a valid contribution, then inject one typed schema mutation.
      classifications:
        - valid
        - layman-node
        - renderer-prop
        - eager-view
        - missing-identity
    preconditions:
      - Artifact and plugin identity have already passed admission.
    oracle:
      primary:
        kind: model
        description: >-
          A closed renderer-neutral field model computes admission.
        independence: The model does not import a renderer or catalog code.
      alternative:
        kind: metamorphic
        description: >-
          Adding a forbidden renderer field changes acceptance to rejection.
        independence: Mutations are derived from the normative field list.
    failure_value: >-
      A plugin persists a Layman node and prevents another renderer projection.
    runner:
      language: typescript
      library: fast-check
      test_id: architecture.workspace-contribution-schema.property
      shrink: required
      replay: required
    tiers: [pr]
    status: passing
    deletion_gates: [DELETE-G-STATIC-WORKSPACE]
deliverables:
  - One activation-owned catalog family for all optional contributions.
  - A versioned semantic workspace with legacy and Layman projections.
  - Agent inspection and operation through stable semantic identities.
deletion_gates:
  - id: DELETE-G-STATIC-WORKSPACE
    condition: >-
      Workspace, renderer, cleanup, absence, package, and live proofs pass.
    removes:
      - Static module membership and remaining lifecycle shims.
      - Hard-coded workspace contribution registries.
      - Remaining native module crates and raw feature shims.
