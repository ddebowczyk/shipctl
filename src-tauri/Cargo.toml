[package]
name = "shipctl-ui"
version = "0.0.0"
description = "Terminal workspace manager"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shipctl_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shipctl-ui"
path = "src/main.rs"

[features]
default = []
fixture-module = ["dep:shipctl-module-fixture"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v5"] }
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
dirs = "6.0"
tauri-plugin-dialog = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-notification = "2"
shipctl-core = { path = "../core/backend" }
shipctl-tauri-adapter = { path = "../core/tauri" }
shipctl-module-fixture = { package = "tauri-plugin-shipctl-fixture", path = "../examples/module-fixture/backend", optional = true }
