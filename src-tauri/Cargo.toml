[package]
name = "shep"
version = "0.5.0"
description = "Terminal workspace manager"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["todos-module", "ports-module", "skills-module", "git-module", "assistants-module", "usage-module"]
fixture-module = ["dep:shep-module-fixture"]
todos-module = ["dep:shep-module-todos"]
ports-module = ["dep:shep-module-ports"]
skills-module = ["dep:shep-module-skills"]
git-module = ["dep:shep-module-git"]
assistants-module = ["dep:shep-module-assistants"]
usage-module = ["dep:shep-module-usage"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
dirs = "6.0"
tauri-plugin-dialog = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
shep-core = { path = "../core/backend" }
shep-module-api = { path = "../modules/api/backend" }
shep-module-fixture = { package = "tauri-plugin-shep-fixture", path = "../modules/fixture/backend", optional = true }
shep-module-todos = { package = "tauri-plugin-shep-todos", path = "../modules/todos/backend", optional = true }
shep-module-ports = { package = "tauri-plugin-shep-ports", path = "../modules/ports/backend", optional = true }
shep-module-skills = { package = "tauri-plugin-shep-skills", path = "../modules/skills/backend", optional = true }
shep-module-git = { package = "tauri-plugin-shep-git", path = "../modules/git/backend", optional = true }
shep-module-assistants = { package = "tauri-plugin-shep-assistants", path = "../modules/assistants/backend", optional = true }
shep-module-usage = { package = "tauri-plugin-shep-usage", path = "../modules/usage/backend", optional = true }
