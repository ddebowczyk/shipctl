[package]
name = "shipctl-module-semantic-terminal-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "shipctl_module_semantic_terminal_host"
path = "src/lib.rs"

[dependencies]
serde = "1.0"
serde_json = "1.0"
shipctl-core = { path = "../../../core/backend" }
shipctl-module-api = { path = "../../api/backend" }
shipctl-module-semantic-terminal = { package = "tauri-plugin-shipctl-semantic-terminal", path = "../backend" }
tauri = { version = "2.11.5", default-features = false }
