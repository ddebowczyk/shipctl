[package]
name = "tauri-plugin-shipctl-semantic-terminal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-shipctl-semantic-terminal"

[lib]
name = "shipctl_module_semantic_terminal"
path = "src/lib.rs"

[dependencies]
shipctl-module-semantic-terminal-core = { path = "../core" }
serde_json = "1.0"
tauri = { version = "2.11.5", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
