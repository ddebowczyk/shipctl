[package]
name = "tauri-plugin-shipctl-semantic-terminal"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-shipctl-semantic-terminal"

[lib]
name = "shipctl_module_semantic_terminal"
path = "src/lib.rs"

[dependencies]
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "72ac98f292879bf9f788fcbb11238c562a1eebe6", default-features = false }
shipctl-module-api = { path = "../../api/backend" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }

[dev-dependencies]
portable-pty = "0.9"
