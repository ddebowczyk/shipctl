[package]
name = "tauri-plugin-shipctl-usage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-shipctl-usage"

[lib]
name = "shipctl_module_usage"
path = "src/lib.rs"

[dependencies]
dirs = "6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.11.5", default-features = false, features = ["test"] }
