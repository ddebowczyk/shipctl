---
schema_version: 1
id: usage
frontend:
  package: "@shipctl/module-usage"
  path: modules/usage/frontend
  composition_symbol: usageModule
backend:
  crate: tauri-plugin-shipctl-usage
  path: modules/usage/backend
  cargo_feature: usage-module
  dependency_alias: shipctl-module-usage
  install: >-
    shipctl_module_usage_host::install(
      builder,
      workspace.clone(),
      message_bridges.clone(),
      paths.usage_database.clone(),
      durable_writes.clone()
    )
  host:
    crate: shipctl-module-usage-host
    path: modules/usage/host
    dependency_alias: shipctl-module-usage-host
tauri:
  capability_identifier: usage
  permissions:
    - shipctl-usage:allow-get-all-usage-snapshots
    - shipctl-usage:allow-get-usage-snapshot
    - shipctl-usage:allow-get-usage-details
    - shipctl-usage:allow-get-usage-overview
    - shipctl-usage:allow-get-project-alias-review-queue
    - shipctl-usage:allow-refresh-usage-data
messages:
  provides:
    - id: usage.ingest-completed
      version: 1
      schema: modules/usage/messages/ingest-completed.schema.json
      max_encoded_bytes: 2
      redacted_fields: []
      compatible_versions:
        - 1
    - id: usage.refresh-request
      version: 1
      schema: modules/usage/messages/refresh-request.schema.json
      max_encoded_bytes: 2
      redacted_fields: []
      compatible_versions:
        - 1
  handles:
    - id: usage.refresh-request
      message:
        id: usage.refresh-request
        version: 1
      capacity: 1
      required_grant: message.send.usage.refresh-request
      scheduler_allowed: true
  publishes:
    - id: usage.ingest-completed
      message:
        id: usage.ingest-completed
        version: 1
      capacity: 1
      required_grant: message.publish.usage.ingest-completed
      scheduler_allowed: false
  subscribes:
    - id: usage.ingest-completed
      message:
        id: usage.ingest-completed
        version: 1
      required_grant: message.subscribe.usage.ingest-completed
  ports: []
profile: ops/modularity/profiles/usage-disabled/tauri.conf.json
tests:
  frontend: modules/usage/frontend/tests
  backend: 'CARGO_TARGET_DIR="$PWD/target/usage-characterization" cargo test -p tauri-plugin-shipctl-usage -- --test-threads=1'
