[package]
name = "tauri-plugin-shep-assistants"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-shep-assistants"

[lib]
name = "shep_module_assistants"
path = "src/lib.rs"

[dependencies]
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shep-module-api = { path = "../../api/backend" }
tauri = { version = "2.11.5", default-features = false }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.11.5", default-features = false, features = ["test"] }
