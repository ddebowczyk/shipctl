[package]
name = "shipctl-module-assistants-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "shipctl_module_assistants_host"
path = "src/lib.rs"

[dependencies]
shipctl-core = { path = "../../../core/backend" }
shipctl-module-api = { path = "../../api/backend" }
shipctl-module-assistants = { package = "tauri-plugin-shipctl-assistants", path = "../backend" }
tauri = { version = "2.11.5", default-features = false }
