[package]
name = "shipctl-core"
version = "0.0.0"
description = "Shipctl's own capabilities: workspace storage, terminals, projects, appearance, settings"
edition = "2021"
rust-version.workspace = true

[lib]
name = "shipctl_core"

[dependencies]
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
jsonschema = { version = "0.49.8", default-features = false }
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "72ac98f292879bf9f788fcbb11238c562a1eebe6", default-features = false }
semver = "1.0"
serde_yaml = "0.9"
cronexpr = "1.5"
portable-pty = "0.9"
crossbeam-channel = "0.5"
base64 = "0.22"
dirs = "6.0"
glob = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
libc = "0.2"
core-text = "22"
core-foundation = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
interprocess = "2.4.3"
fs4 = "1.1.0"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tar = "0.4"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"
