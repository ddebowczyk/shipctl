[package]
name = "shipctl-core"
version = "0.0.0"
description = "Shipctl's own capabilities: workspace storage, terminals, projects, appearance, settings"
edition = "2021"
rust-version.workspace = true

[lib]
name = "shipctl_core"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
serde_yaml = "0.9"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
portable-pty = "0.9"
dirs = "6.0"
libc = "0.2"
notify = { version = "8", features = ["macos_fsevent"] }
core-text = "22"
core-foundation = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
interprocess = "2.4.3"
fs4 = "1.1.0"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
shipctl-module-api = { path = "../../modules/api/backend" }
tar = "0.4"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
widestring = "1"
