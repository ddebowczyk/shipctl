---
type: object
additionalProperties: false
required: [schema_version, groups, entries]
properties:
  schema_version:
    const: 1
  groups:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        description:
          type: string
          minLength: 1
  entries:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, kind, group, description]
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^[^/]+$
        kind:
          enum: [directory, file, symlink, other]
        group:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        description:
          type: string
          minLength: 1
