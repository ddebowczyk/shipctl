---
type: object
additionalProperties: false
required:
  - schema_version
  - created_at
  - archive_mode
  - version
  - target
  - git_commit
  - git_dirty
  - build_command
  - artifacts
properties:
  schema_version:
    const: 1
  created_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  archive_mode:
    enum: [build, archive-only]
  version:
    type: string
    minLength: 1
  target:
    type: string
    minLength: 1
  git_commit:
    type: string
    pattern: ^[0-9a-f]{40}$
  git_dirty:
    type: boolean
  build_command:
    type: string
    minLength: 1
  artifacts:
    type: object
    additionalProperties: false
    required: [app, dmg]
    properties:
      app:
        type: object
        additionalProperties: false
        required: [path, executable_sha256]
        properties:
          path:
            const: shep.app
          executable_sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
      dmg:
        type: object
        additionalProperties: false
        required: [path, sha256]
        properties:
          path:
            type: string
            pattern: ^shep_.+\.dmg$
          sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
