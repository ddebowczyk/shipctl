---
schema_version: 1
id: build
provides: build
description: Build and package application artifacts.
status: supported
requires:
  tools:
    - bash
    - cargo
    - ditto
    - git
    - jq
    - just
    - node
    - pnpm
    - rustc
    - shasum
    - yamllint
    - yq
    - ys
  capabilities: [architecture, check, modularity, version]
owns: [ops/build/**]
reads:
  - core/**
  - examples/module-fixture/**
  - modules/**
  - ops/architecture/lib/plugin-artifact-build.mjs
  - src/**
  - src-tauri/**
generates: [dist/**, builds/**, target/**]
commands:
  - name: app
    summary: Build the production frontend application.
    lane: slow
  - name: local
    summary: Build an isolated Shipctl preview bundle.
    lane: slow
    args: [target]
  - name: package
    summary: Build the canonical ad-hoc Shipctl distribution bundle.
    lane: slow
    args: [target]
  - name: unregister-legacy
    summary: Unregister competing Shipctl release-identity apps from macOS LaunchServices.
    lane: fast
    args: [apply]
  - name: module-fixture
    summary: Build the module-composition smoke fixture.
    lane: slow
  - name: release
    summary: Build a signed and notarized release.
    lane: slow
  - name: dmg
    summary: Patch and re-sign the release DMG.
    lane: slow
  - name: icon
    summary: Generate the application icon asset.
    lane: slow
skills:
  - name: releasing
    summary: >-
      Cut an ad-hoc signed release and publish its Homebrew Cask.
