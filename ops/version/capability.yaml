---
schema_version: 1
id: version
provides: version
description: Own and validate the independent Shipctl product version.
status: supported
requires:
  tools: [node, yq, ys]
  capabilities: []
owns: [ops/version/**]
reads:
  - package.json
  - Cargo.toml
  - cli/Cargo.toml
  - core/**/Cargo.toml
  - examples/**/Cargo.toml
  - examples/**/package.json
  - modules/**/Cargo.toml
  - modules/**/package.json
  - ops/modularity/profiles/**/tauri.conf.json
  - src-tauri/Cargo.toml
generates: [src-tauri/tauri.conf.json]
commands:
  - name: show
    summary: Show the authoritative product version and packaging projection.
    lane: fast
  - name: check
    summary: Validate the version record and every required projection.
    lane: fast
  - name: next
    summary: Preview a patch, minor, or major product version.
    lane: fast
    args: [part]
  - name: set
    summary: Forward-only product version change using the local release ledger.
    lane: fast
    args: [version]
  - name: verify-release
    summary: Verify that HEAD is clean and matches an annotated current-version release tag.
    lane: fast
  - name: sync
    summary: Fetch release tags from origin before a local ledger check.
    lane: slow
skills:
  - name: versioning
    summary: Change and verify Shipctl product versions and release tags.
