---
type: object
additionalProperties: false
required:
  - schema_version
  - product
  - product_version
  - description
properties:
  schema_version:
    const: 1
  product:
    const: shipctl
  product_version:
    type: string
    pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
  description:
    type: string
    minLength: 1
