---
schema_version: 1
id: check
provides: check
description: Run non-executing correctness checks.
status: supported
requires:
  tools: [cargo, just, node, pnpm, yamllint, yq, ys]
  capabilities: [modularity, version]
owns: [ops/check/**]
reads:
  - Cargo.toml
  - core/**
  - examples/module-fixture/**
  - modules/**
  - src/**
  - src-tauri/**
  - package.json
  - ops/modularity/bin/plugout.mjs
  - ops/modularity/fixtures/module-fixture/enabledModules.ts
  - ops/modularity/profiles/**
  - ops/repository/**
  - ops/ops.yaml
  - ops/schema/**
  - ops/*/capability.yaml
  - ops/upstream/**
  - ops/version/current.yaml
  - ops/version/justfile
  - ops/version/schema/**
generates: []
commands:
  - name: types
    summary: Type-check the application without building it.
    lane: fast
  - name: types-all
    summary: Type-check the application and smoke fixtures.
    lane: fast
    aggregate: check
  - name: fmt
    summary: Check Rust workspace formatting.
    lane: fast
    aggregate: check
  - name: clippy-soft
    summary: Report Rust workspace warnings against the recorded baseline.
    lane: fast
    aggregate: check
  - name: schemas
    summary: Validate schema-bearing YAML and ledger frontmatter.
    lane: fast
    aggregate: check
  - name: manifests
    summary: Cross-check module manifests against live declaration sites.
    lane: fast
    aggregate: check
  - name: version
    summary: Delegate product-version validation to the version capability.
    lane: fast
    aggregate: check
  - name: instance-paths
    summary: Reject instance-owned state outside the injected path boundary.
    lane: fast
    aggregate: check
  - name: cli-boundary
    summary: Reject Tauri and Wry dependencies in the shared core and standalone CLI.
    lane: fast
    aggregate: check
  - name: release-bundle
    summary: Reject a release bundle that carries the dev-only scenario harness.
    lane: fast
    aggregate: check
  - name: all
    summary: Run every declared fast check.
    lane: fast
skills: []
