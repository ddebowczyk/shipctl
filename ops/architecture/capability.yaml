    aggregate: check
  - name: test
    summary: Run the serialized source-level architecture property suite.
    lane: fast
    aggregate: test
  - name: evidence
    summary: >-
      Run controlled fresh and replay campaigns and reject missing, stale, or
      mixed-source property evidence.
    lane: slow
  - name: inspect
    summary: Emit the current runtime-artifact source snapshot as JSON.
    lane: fast
  - name: baseline
    summary: Compare the generated architecture with the reviewed baseline.
    lane: fast
    aggregate: check
  - name: boundaries
    summary: Enforce module imports and passive public entrypoints.
    lane: fast
    aggregate: check
  - name: graph
    summary: Print the phase, capability, and module dependency graph as JSON.
    lane: fast
  - name: messages
    summary: Run the seeded Messages semantic-service property suite.
    lane: fast
  - name: processes
    summary: Run the seeded Processes semantic-service property suite.
    lane: fast
  - name: cordis
    summary: Run the seeded Cordis static-composition property suite.
    lane: fast
  - name: ports-extraction
    summary: Prove the Ports native-provider extraction and deletion gate.
    lane: fast
  - name: todos-extraction
    summary: Prove the Todos native-provider extraction and deletion gate.
    lane: fast
  - name: git-extraction
    summary: Prove the Git native-provider extraction and deletion gate.
    lane: fast
  - name: skills-extraction
    summary: Prove the Skills native-provider extraction and deletion gate.
    lane: fast
  - name: semantic-terminal-extraction
    summary: >-
      Prove the Semantic Terminal native-provider extraction and deletion gate.
    lane: fast
  - name: all
    summary: Validate the program, boundaries, baseline, and property proofs.
    lane: fast
skills: []
