---
schema_version: 1
id: architecture
provides: architecture
description: Validate and inspect the executable four-layer migration program.
status: supported
requires:
  tools: [cargo, node, rg, yamllint, yq, ys]
  capabilities: []
owns:
  - docs/4-layer-architecture/spec/**
  - ops/architecture/**
reads:
  - core/**
  - docs/4-layer-architecture/*.md
  - module-api/**
