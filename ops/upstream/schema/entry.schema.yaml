---
type: object
additionalProperties: false
required: [upstream, subject, authored, verdict]
properties:
  upstream:
    type: string
    pattern: ^[0-9a-f]{7}$
  subject:
    type: string
    minLength: 1
  authored:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  reviewed:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  verdict:
    enum: [pending, adopt, adapt, reject, n-a]
  integration:
    enum: [replace, variant, new]
  seam:
    type: string
    minLength: 1
  areas:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  bd:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  integrated:
    type: string
    pattern: ^[0-9a-f]{7,40}$
allOf:
  - if:
      properties:
        verdict:
          enum: [adopt, adapt]
    then:
      required: [reviewed, integration, areas, bd]
      properties:
        bd:
          minItems: 1
  - if:
      properties:
        verdict:
          enum: [reject]
    then:
      required: [reviewed, areas]
  - if:
      properties:
        verdict:
          enum: [n-a]
    then:
      required: [reviewed]
