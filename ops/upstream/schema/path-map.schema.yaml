---
type: object
additionalProperties: false
required: [paths]
properties:
  paths:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [glob, status]
      properties:
        glob:
          type: string
          minLength: 1
        status:
          type: string
          pattern: ^(same|dead|ignore|unknown|module:[a-z][a-z0-9-]*)$
