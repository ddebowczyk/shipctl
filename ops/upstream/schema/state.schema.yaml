---
type: object
additionalProperties: false
required:
  - upstream_remote
  - watermark_ref
  - last_fetch
  - last_upstream_head
  - last_upstream_tag
  - batches
properties:
  upstream_remote:
    type: string
    minLength: 1
  watermark_ref:
    const: upstream-reviewed
  last_fetch:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  last_upstream_head:
    type: string
    pattern: ^[0-9a-f]{7,40}$
  last_upstream_tag:
    type: string
    minLength: 1
  batches:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - date
        - range
        - commits_total
        - merges_skipped
        - triaged
        - n_a
        - adopt
        - adapt
        - reject
        - pending
      properties:
        date:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        range:
          type: string
          pattern: ^[0-9a-f]{7,40}\.\.[0-9a-f]{7,40}$
        commits_total:
          type: integer
          minimum: 0
        merges_skipped:
          type: integer
          minimum: 0
        triaged:
          type: integer
          minimum: 0
        n_a:
          type: integer
          minimum: 0
        adopt:
          type: integer
          minimum: 0
        adapt:
          type: integer
          minimum: 0
        reject:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
