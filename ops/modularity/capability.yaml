---
schema_version: 1
id: modularity
provides: modularity
description: Verify application and repository modularity boundaries.
status: supported
requires:
  tools: [cargo, git, node, pnpm, rg, yq]
  capabilities: []
owns:
  - examples/module-fixture/**
  - ops/modularity/**
  - ops/schema/**
  - ops/bin/**
  - ops/ops.yaml
  - ops/MSW.md
  - ops/README.md
  - ops/justfile
reads:
  - core/**
  - modules/**
  - src/**
  - src-tauri/**
  - package.json
  - pnpm-workspace.yaml
generates: [ops/modularity/profiles/*-disabled/tauri.conf.json]
commands:
  - name: validate
    summary: Validate operation schemas and ownership invariants.
    lane: fast
    aggregate: check
  - name: boundaries
    summary: Check static frontend import boundaries.
    lane: fast
    aggregate: check
  - name: profiles-check
    summary: Check committed disabled-module profiles against module manifests.
    lane: fast
    aggregate: check
  - name: profiles-sync
    summary: >-
      Regenerate committed disabled-module profiles from module manifests.
    lane: slow
  - name: plugout
    summary: >-
      Verify static enabled, disabled, and source-absent module contracts
      without rebuilding.
    lane: fast
    args: [module]
  - name: frontend-disabled
    summary: >-
      Verify a module's frontend-disabled composition contract without
      rebuilding.
    lane: fast
    args: [module]
  - name: native-disabled
    summary: >-
      Verify legacy native-disabled declaration consistency without rebuilding.
    lane: fast
    args: [module]
  - name: all
    summary: >-
      Run static modularity contracts for every pluggable module without
      rebuilding.
    lane: fast
  - name: smoke
    summary: Run a named modularity smoke fixture.
    lane: slow
    args: [target]
skills: []
