---
type: object
additionalProperties: false
required: [schema_version, id, frontend, profile, tests]
properties:
  schema_version:
    const: 1
  id:
    type: string
    pattern: ^[a-z][a-z0-9-]*$
  frontend:
    type: object
    additionalProperties: false
    required: [package, path]
    properties:
      package:
        type: string
        pattern: ^@shipctl/module-[a-z0-9-]+$
      path:
        type: string
        pattern: >-
          ^(?:modules/[a-z0-9-]+/frontend|examples/module-fixture/frontend)$
      composition_symbol:
        type: string
        pattern: ^[a-z][A-Za-z0-9]*Module$
  backend:
    type: object
    additionalProperties: false
    required: [crate, path]
    properties:
      crate:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      path:
        type: string
        pattern: >-
          ^(?:modules/[a-z0-9-]+/backend|examples/module-fixture/backend)$
      cargo_feature:
        type: string
        pattern: ^[a-z][a-z0-9-]*-module$
      dependency_alias:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      plugin_init:
        type: string
        minLength: 1
      install:
        type: string
        minLength: 1
      host:
        type: object
        additionalProperties: false
        required: [crate, path, dependency_alias]
        properties:
          crate:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
          path:
            type: string
            pattern: ^modules/[a-z0-9-]+/host$
          dependency_alias:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
    allOf:
      - if:
          anyOf:
            - required: [cargo_feature]
            - required: [dependency_alias]
            - required: [plugin_init]
            - required: [install]
            - required: [host]
        then:
          allOf:
            - required: [cargo_feature, dependency_alias]
            - anyOf:
                - required: [plugin_init]
                - required: [install]
      - if:
          required: [host]
        then:
          required: [install]
  tauri:
    type: object
    additionalProperties: false
    required: [capability_identifier, permissions]
    properties:
      capability_identifier:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      permissions:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$
  messages:
    type: object
    additionalProperties: false
    required: [provides, handles, publishes, subscribes, ports]
    properties:
      provides:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - version
            - schema
            - max_encoded_bytes
            - redacted_fields
            - compatible_versions
          properties:
            id:
              $ref: "#/$defs/scoped_id"
            version:
              $ref: "#/$defs/nonzero_integer"
            schema:
              type: string
              pattern: >-
                ^(?:modules/[a-z0-9-]+/messages|examples/module-fixture/messages)/(?:[a-z0-9-]+/)*[a-z0-9-]+\.schema\.json$
            max_encoded_bytes:
              $ref: "#/$defs/nonzero_integer"
            redacted_fields:
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: ^/(?:[^~]|~[01])*$
            compatible_versions:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/$defs/nonzero_integer"
      handles:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/directed_endpoint"
      publishes:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/broadcast_endpoint"
      subscribes:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, message, required_grant]
          properties:
            id:
              $ref: "#/$defs/scoped_id"
            message:
              $ref: "#/$defs/message_ref"
            required_grant:
              $ref: "#/$defs/message_grant"
      ports:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - request
            - response
            - capacity
            - required_grant
            - scheduler_allowed
          properties:
            id:
              $ref: "#/$defs/scoped_id"
            request:
              $ref: "#/$defs/message_ref"
            response:
              $ref: "#/$defs/message_ref"
            capacity:
              $ref: "#/$defs/nonzero_integer"
            required_grant:
              $ref: "#/$defs/message_grant"
            scheduler_allowed:
              type: boolean
  profile:
    type: [string, "null"]
    pattern: ^ops/modularity/profiles/[a-z0-9-]+/tauri\.conf\.json$
  tests:
    type: object
    additionalProperties: false
    required: [frontend, backend]
    properties:
      frontend:
        type: [string, "null"]
        pattern: >-
          ^(?:modules/[a-z0-9-]+/frontend/tests|examples/module-fixture/tests)(?:/.*)?$
      backend:
        type: [string, "null"]
        minLength: 1
$defs:
  nonzero_integer:
    type: integer
    minimum: 1
  scoped_id:
    type: string
    pattern: ^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)+$
  message_grant:
    type: string
    pattern: >-
      ^message\.(?:send|publish|request|handle|subscribe)(?:\.[a-z][a-z0-9-]*)+$
  message_ref:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id:
        $ref: "#/$defs/scoped_id"
      version:
        $ref: "#/$defs/nonzero_integer"
  directed_endpoint:
    type: object
    additionalProperties: false
    required: [id, message, capacity, required_grant, scheduler_allowed]
    properties:
      id:
        $ref: "#/$defs/scoped_id"
      message:
        $ref: "#/$defs/message_ref"
      capacity:
        $ref: "#/$defs/nonzero_integer"
      required_grant:
        $ref: "#/$defs/message_grant"
      scheduler_allowed:
        type: boolean
  broadcast_endpoint:
    type: object
    additionalProperties: false
    required: [id, message, capacity, required_grant, scheduler_allowed]
    properties:
      id:
        $ref: "#/$defs/scoped_id"
      message:
        $ref: "#/$defs/message_ref"
      capacity:
        $ref: "#/$defs/nonzero_integer"
      required_grant:
        $ref: "#/$defs/message_grant"
      scheduler_allowed:
        type: boolean
